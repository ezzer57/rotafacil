services:
  banco:
    image: postgis/postgis:16-3.4
    container_name: rotafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rotafacil
      POSTGRES_PASSWORD: rotafacil
      POSTGRES_DB: rotafacil
    ports:
      - '${DB_PORTA:-5432}:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rotafacil -d rotafacil']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres:
