# Site estático gerado por `expo export --platform web` (saída "static").
server {
  listen 80;
  root /usr/share/nginx/html;

  # Arquivos com hash no nome: podem ficar em cache para sempre.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rota dinâmica: o id do roteiro não existe no build, então qualquer
  # /roteiro/<id> usa a mesma página, e o aplicativo lê o id da URL.
  location /roteiro/ {
    try_files $uri $uri.html "/roteiro/[id].html";
  }

  # Cada tela virou um arquivo .html (ex.: /nova-rota -> nova-rota.html).
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
